<div class="fila" [class.fila-usuario]="mensaje().rol === 'usuario'">
  <div class="burbuja" [class.burbuja-usuario]="mensaje().rol === 'usuario'"
       [class.burbuja-error]="mensaje().rol === 'error'">
    <div class="d-flex align-items-center gap-2 mb-1">
      <i class="bi {{ icono() }}"></i>
      <span class="fw-semibold small">{{ autor() }}</span>
      <span class="small opacidad-hora ms-auto">{{ mensaje().hora }}</span>
    </div>
    <div class="texto">{{ texto() }}</div>
    @if (mensaje().fuentes.length) {
      <div class="fuentes d-flex flex-wrap align-items-center gap-1 mt-2">
        <i class="bi bi-paperclip"></i>
        @for (fuente of mensaje().fuentes; track fuente) {
          <span class="badge text-bg-light border fw-normal">{{ fuente }}</span>
        }
      </div>
    }
  </div>
</div>
