<main class="contenedor-panel">
  <div class="container-fluid px-3 px-lg-4">

    <div class="mt-3">
      <app-alerta [alerta]="alerta.actual()" (cerrar)="alerta.limpiar()" />
    </div>

    <div class="row g-3 mt-1 mb-3">
      <div class="col-6 col-lg-3">
        <app-kpi-card etiqueta="Correos registrados" [valor]="resumen().total" />
      </div>
      <div class="col-6 col-lg-3">
        <app-kpi-card etiqueta="Enviados" [valor]="resumen().enviadas" />
      </div>
      <div class="col-6 col-lg-3">
        <app-kpi-card etiqueta="Fallidos" [valor]="resumen().fallidas" />
      </div>
      <div class="col-6 col-lg-3">
        <app-kpi-card etiqueta="Pendientes" [valor]="resumen().pendientes" />
      </div>
    </div>

    <div class="card tarjeta-tabla mb-5">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <div>
            <h1 class="h5 fw-bold mb-0">Notificaciones por correo</h1>
            <p class="text-muted small mb-0">
              Seguimiento de los correos que envía el sistema: registro de usuarios, ventas, alertas de stock y de ambiente, y reportes.
            </p>
          </div>
          <div class="d-flex gap-2">
            <div class="input-group filtro-estado">
              <span class="input-group-text"><i class="bi bi-funnel"></i></span>
              <select class="form-select" aria-label="Filtrar por estado" [value]="filtroEstado()"
                      (change)="cambiarFiltro($any($event.target).value)">
                <option value="">Todos los estados</option>
                @for (e of estados; track e.valor) {
                  <option [value]="e.valor">{{ e.etiqueta }}</option>
                }
              </select>
            </div>
            <button type="button" class="btn btn-outline-dark" title="Actualizar" aria-label="Actualizar" (click)="cargar()">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>

        <app-data-table [datos]="registros()" [columnas]="columnas" etiqueta="Notificaciones por correo"
          placeholderBusqueda="Buscar por destinatario, asunto o evento..." iconoVacio="bi-envelope-paper"
          [mensajeVacio]="mensajeVacio()" />
      </div>
    </div>

  </div>
</main>
