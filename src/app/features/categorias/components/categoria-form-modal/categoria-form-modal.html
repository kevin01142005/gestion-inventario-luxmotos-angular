<app-modal [abierto]="abierto()" (cerrar)="cerrar.emit()">
  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <div class="modal-header">
      <h5 class="modal-title fw-bold">
        <i class="bi" [class.bi-tags]="!esEdicion" [class.bi-pencil-square]="esEdicion"></i>
        {{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}
      </h5>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrar.emit()"></button>
    </div>
    <div class="modal-body">
      <app-alerta [alerta]="error()" (cerrar)="cerrarError.emit()" />

      <div class="mb-3">
        <label for="nombreCategoria" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombreCategoria" formControlName="nombre" />
        @if (intento() && form.controls.nombre.invalid) {
          <div class="invalid-feedback d-block">El nombre es obligatorio.</div>
        }
      </div>
      <div class="mb-0">
        <label for="descripcionCategoria" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcionCategoria" rows="2" formControlName="descripcion"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-dark" (click)="cerrar.emit()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar categoría' }}
      </button>
    </div>
  </form>
</app-modal>
