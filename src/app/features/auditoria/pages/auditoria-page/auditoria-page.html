<main class="contenedor-panel">
  <div class="container-fluid px-3 px-lg-4">

    <div class="mt-3">
      <app-alerta [alerta]="alerta.actual()" (cerrar)="alerta.limpiar()" />
    </div>

    <div class="card tarjeta-tabla mt-3 mb-5">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <div>
            <h1 class="h5 fw-bold mb-0">Registro de auditoría</h1>
            <p class="text-muted small mb-0">Historial de creaciones, actualizaciones y eliminaciones realizadas en el sistema</p>
          </div>
          <div class="input-group filtro-entidad">
            <span class="input-group-text"><i class="bi bi-funnel"></i></span>
            <select class="form-select" aria-label="Filtrar por entidad" [value]="filtroEntidad()"
                    (change)="filtroEntidad.set($any($event.target).value)">
              <option value="">Todas las entidades</option>
              @for (e of entidades; track e.valor) {
                <option [value]="e.valor">{{ e.etiqueta }}</option>
              }
            </select>
          </div>
        </div>

        <app-data-table [datos]="registros()" [columnas]="columnas" etiqueta="Registro de auditoría"
          placeholderBusqueda="Buscar en la auditoría..." iconoVacio="bi-shield-lock"
          [mensajeVacio]="mensajeVacio()" />
      </div>
    </div>

  </div>
</main>
