<app-modal [abierto]="abierto()" [grande]="true" [conScroll]="true" (cerrar)="cerrar.emit()">
  <div class="modal-header">
    <h5 class="modal-title fw-bold">
      <i class="bi bi-bicycle"></i> Compatibilidad con motos · <span>{{ producto()?.nombre }}</span>
    </h5>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrar.emit()"></button>
  </div>
  <div class="modal-body">
    <app-alerta [alerta]="error()" (cerrar)="cerrarError.emit()" />

    @if (puedeAgregar()) {
      <div class="bloque-agregar mb-4">
        <app-selector-moto [activo]="abierto()" [deshabilitado]="guardando()" (versionElegida)="alVersion($event)" />
        <div class="d-flex justify-content-end mt-3">
          <button type="button" class="btn btn-primary" [disabled]="guardando()" (click)="enviar()">
            <i class="bi bi-plus-lg"></i> {{ guardando() ? 'Agregando...' : 'Agregar moto compatible' }}
          </button>
        </div>
      </div>
    }

    <app-data-table [datos]="compatibilidades()" [columnas]="columnas()" [porPagina]="5"
      etiqueta="Motos compatibles" placeholderBusqueda="Buscar moto..." iconoVacio="bi-bicycle"
      [mensajeVacio]="cargando() ? 'Cargando compatibilidades...' : 'Este producto aún no tiene motos compatibles registradas.'"
      (accion)="alAccion($event)" />
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="cerrar.emit()">Cerrar</button>
  </div>
</app-modal>
